fillmate: 1
id: timesheet
name: Monthly timesheet (example)
version: "1.0"
description: >
  A made-up timesheet that shows tables: type the days and times, the hours are
  computed, and a second sheet is added when the rows don't fit on one page.
author: fillmate
country: GB
date_format: "%d/%m/%Y"

profile:
  - {id: full_name, label: Full name, required: true}
  - {id: manager_email, label: Manager's email, required: true}

fields:
  - {id: month, label: Month, placeholder: "e.g. November 2026", required: true}
  - {id: project, label: Project}
  - id: work
    label: Hours worked
    type: table
    required: true
    columns:
      - {id: day, label: Date, type: date, format: "%d/%m"}
      - {id: start, label: From, type: time, default: "09:00"}
      - {id: end, label: To, type: time, default: "13:00"}
      - {id: hours, label: Hours, formula: "hours_between(start, end)"}
      - {id: activity, label: Activity}

computed:
  total_hours: "{{ work | total('hours') }}"

rules:
  - warn_if: "work | days('day') > 22"
    message: "{{ work | days('day') }} working days in one month: check the dates."

documents:
  - id: timesheet
    label: Timesheet (PDF)
    template: timesheet.pdf
    output: "Timesheet_{{ full_name | slug }}_{{ month | slug }}"
    fill:
      - {value: "{{ full_name }}", lines: [[112, 138, 300]]}
      - {value: "{{ month }}", lines: [[367, 138, 555]]}
      - {value: "{{ project }}", lines: [[112, 163, 555]]}
      - table: work
        xs: [40, 110, 160, 210, 260, 470, 555]
        ys: [214, 236, 258, 280, 302, 324, 346, 368, 390, 412, 434, 456, 478, 500, 522, 544, 566, 588, 610, 632, 654]
        cols: [day, start, end, hours, activity, ~]
      - {value: "{{ sheet.rows | days('day') }}", lines: [[142, 682, 200]]}
      - {value: "{{ sheet.rows | total('hours') }}", lines: [[337, 682, 395]]}
      - {value: "{{ sheet.number }} of {{ sheet.count }}", lines: [[467, 682, 555]]}

output_folder: "{{ month | slug }}_timesheet"

email:
  to: ["{{ manager_email }}"]
  subject: "Timesheet {{ month }} – {{ full_name }}"
  body: |
    Hello,

    here is my timesheet for {{ month }}: {{ total_hours }} hours in total.

    Kind regards,
    {{ full_name }}
