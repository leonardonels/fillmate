# Push a tag like v0.2.0 to build every installer (and publish to PyPI, when enabled below):
#   git tag v0.2.0 && git push origin v0.2.0
# The installers are attached to a draft GitHub Release: check them, then publish it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual run: builds the installers as artifacts, no release or PyPI upload

permissions:
  contents: read

jobs:
  python-package:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Windows .msi", id: msi, os: windows-latest, platform: windows, files: "dist/*.msi"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install briefcase
      - name: Build (unsigned)
        run: |
          briefcase create ${{ matrix.platform }} app --no-input
          briefcase build ${{ matrix.platform }} app --no-input
          briefcase package ${{ matrix.platform }} app --adhoc-sign --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.id }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  macos:
    # Briefcase builds and ad-hoc signs the app; the .dmg is made here with dmgbuild instead of
    # Briefcase's DMG step (see packaging/macos/dmg_settings.py for why). Left unsigned on purpose:
    # Gatekeeper then asks about the app once, not about the disk image as well.
    name: macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install briefcase dmgbuild
      - name: Build the app (ad-hoc signed)
        run: |
          briefcase create macOS app --no-input
          briefcase build macOS app --no-input
          briefcase package macOS app --adhoc-sign -p zip --no-input
      - name: Build the .dmg
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['briefcase']['version'])")
          app=$(ls -d build/fillmate/macos/app/*.app)
          codesign --verify --deep --strict "$app"
          tiffutil -cathidpicheck packaging/macos/dmg-background.png packaging/macos/dmg-background@2x.png \
            -out "$RUNNER_TEMP/dmg-background.tiff"
          rm -f dist/*.dmg
          dmgbuild -s packaging/macos/dmg_settings.py -D app="$app" -D background="$RUNNER_TEMP/dmg-background.tiff" \
            "fillmate $version" "dist/fillmate-$version.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-dmg
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    # One self-contained bundle (it carries its own Python), packaged as a .deb for
    # Ubuntu 22.04+ and an .rpm for Fedora / RHEL 9+, then installed and tested on each.
    name: Linux .deb and .rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/linux/build-linux.sh
      - run: packaging/linux/test-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-deb
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installer-rpm
          path: dist/*.rpm
          if-no-files-found: error

  github-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, installers, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*

  pypi:
    name: Publish to PyPI
    # Off until the repository variable PUBLISH_PYPI is set to "true"
    # (Settings → Secrets and variables → Actions → Variables). It also needs a
    # "trusted publisher" set up once on pypi.org for this repo and workflow,
    # and a GitHub environment named "pypi".
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    needs: [python-package, installers, macos, linux]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
